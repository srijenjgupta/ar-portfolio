<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srijen Gupta - AI PM Portfolio</title>
    <!-- Google Model Viewer for Markerless Surface Tracking -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #0d1117; color: white; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        
        .viewer-container { flex-grow: 1; position: relative; width: 100%; }
        model-viewer { width: 100%; height: 100%; }
        
        /* The button that triggers the camera mapping */
        .ar-launch-btn {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #238636; color: white; border: none; padding: 14px 28px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .ui-panel { padding: 25px 20px; text-align: center; background: #161b22; border-top: 1px solid #30363d; }
        .btn-group { display: flex; gap: 12px; justify-content: center; margin-top: 15px; }
        .btn { padding: 12px 20px; font-weight: 600; border-radius: 25px; text-decoration: none; flex: 1; max-width: 160px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .btn-linkedin { background: #0077B5; color: white; }
        .btn-github { background: #ffffff; color: black; }
        
        audio { margin-top: 15px; width: 100%; max-width: 320px; height: 35px; }
    </style>
</head>
<body>

    <!-- 3D and AR Viewport -->
    <div class="viewer-container">
        <model-viewer src="avatar.glb" 
                      ar ar-modes="webxr scene-viewer quick-look" 
                      camera-controls autoplay shadow-intensity="1">
            
            <button slot="ar-button" class="ar-launch-btn">View in 3D Space</button>
        </model-viewer>
    </div>

    <!-- Persistent Profile UI -->
    <div class="ui-panel">
        <h2 style="margin: 0; font-size: 22px;">Srijen Gupta</h2>
        <p style="color: #8b949e; margin: 5px 0 0 0; font-size: 14px;">AI Product Management & Portfolio Optimization</p>
        
        <!-- Native Audio Controls to bypass mobile autoplay blocks safely -->
        <audio id="audioTrack" src="voiceover.mp3" controls></audio>
        
        <div class="btn-group">
            <a href="https://www.linkedin.com/in/srijenjgupta/" class="btn btn-linkedin">Connect</a>
            <a href="https://github.com/srijenjgupta/" class="btn btn-github">GitHub</a>
        </div>
    </div>

    <script>
        const viewer = document.querySelector('model-viewer');
        const audio = document.getElementById('audioTrack');

        // Play audio automatically the exact moment the user drops the avatar into their physical space
        viewer.addEventListener('ar-status', (event) => {
            if(event.detail.status === 'session-started') {
                audio.play().catch(e => console.log("Audio permission bypassed", e));
            }
        });
    </script>
</body>
</html>
